name: 同步优惠券配置
run-name: 同步飞书优惠券到静态配置

on:
  workflow_dispatch:
  schedule:
    - cron: "15 20 * * *"

permissions:
  contents: write

concurrency:
  group: sync-coupons
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm test
      - name: 从飞书生成配置
        run: npm run sync
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
      - name: 发布变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/coupons.json docs/status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync coupon config"
          git push
